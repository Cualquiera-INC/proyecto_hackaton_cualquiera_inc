# Reglas de acceso de PostgreSQL (primario y réplica). Se pasa con
# "-c hba_file=..." en lugar de editar el pg_hba.conf del volumen: así también
# se aplica a una base que ya existía, sin reinicializarla.
#
# TIPO  BASE         USUARIO  DIRECCIÓN      MÉTODO
# Dentro del propio contenedor (healthcheck, datos.py vía docker exec):
local   all          all                     trust
host    all          all      127.0.0.1/32   trust
local   replication  all                     trust
host    replication  all      127.0.0.1/32   trust
# Desde la red interna "datos" (servicio de pedidos, respaldo, réplica): con contraseña.
# PostgreSQL no publica puertos, así que nadie fuera de esa red llega hasta aquí.
host    all          all      all            scram-sha-256
host    replication  all      all            scram-sha-256
