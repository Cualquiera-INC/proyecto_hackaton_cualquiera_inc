events {}
http {
    # DNS interno de las redes de Docker; resolve necesita NGINX >= 1.27.3.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream aplicaciones {
        zone aplicaciones 64k;
        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
    }
    log_format laboratorio '$remote_addr "$request" $status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /dev/stdout laboratorio;
    error_log /dev/stderr warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # API del servicio de consulta (backend)
        location = /pedidos {
            proxy_pass http://aplicaciones;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location = /health {
            proxy_pass http://aplicaciones;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Frontend React (SPA). / deja de exponer el JSON de la app Python.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
