# Solución local del equipo (MVP). Base: ayuda_opcional/compose.yaml.
# Cambios: restart: unless-stopped y el servicio "respaldo".
name: nodo-ruta

x-app: &app
  build:
    context: .
  restart: unless-stopped  # relanza si el proceso muere; no actúa sobre "unhealthy" ni tras "docker compose stop"
  volumes:
    - type: bind
      source: ./data/pedidos.json
      target: /data/pedidos.json
      read_only: true  # la app solo lee y relee el archivo en cada petición
      bind:
        create_host_path: false
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  app1:
    <<: *app
    environment:
      INSTANCE_ID: app1
      DATA_PATH: /data/pedidos.json
  app2:
    <<: *app
    environment:
      INSTANCE_ID: app2
      DATA_PATH: /data/pedidos.json

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"  # único puerto publicado, solo en este computador
    volumes:
      - type: bind
        source: ./ayuda_opcional/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  # Respaldo automático: datos.py valida el JSON antes de copiar, así que no respalda un archivo corrupto.
  # shortcut: sin rotación (cada respaldo pesa ~1 KB); podar los antiguos en E3.
  respaldo:
    build:
      context: .
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python /proj/scripts/datos.py respaldar; sleep 300; done"]
    volumes:
      - ./scripts:/proj/scripts:ro
      - ./data:/proj/data:ro
      - ./respaldos:/proj/respaldos
