events {}
http {
    # DNS interno de Docker. valid=2s: tras recrear una instancia (nueva IP)
    # NGINX la vuelve a resolver rápido. "resolve" requiere NGINX >= 1.27.3.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream aplicaciones {
        zone aplicaciones 64k;
        server app1:8080 resolve max_fails=1 fail_timeout=3s;
        server app2:8080 resolve max_fails=1 fail_timeout=3s;
    }

    log_format despliegue '$time_iso8601 $remote_addr "$request" $status '
                          'upstream=$upstream_addr upstream_status=$upstream_status '
                          'tiempo=$upstream_response_time';
    access_log /dev/stdout despliegue;
    error_log /dev/stderr warn;

    server {
        listen 80;

        # Salud del proxy (no depende de las aplicaciones).
        location = /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://aplicaciones;
            proxy_set_header Host $host;
            # En la red interna una conexión sana tarda milisegundos; un tiempo
            # corto evita esperar 1 s cuando una instancia está reiniciando.
            proxy_connect_timeout 300ms;
            proxy_read_timeout 3s;
            # Si una instancia no responde o devuelve error, se reintenta en la
            # otra (solo consultas GET, seguras de repetir).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
